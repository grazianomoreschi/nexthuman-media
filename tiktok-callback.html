<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect TikTok - Next Human Publisher</title><meta name="robots" content="noindex">
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#1d1d1f;background:#fff}
input{width:100%;box-sizing:border-box;padding:10px;font-size:15px;margin:4px 0 12px}button{padding:10px 18px;font-size:16px;cursor:pointer}
code{display:block;word-break:break-all;background:#f0efec;padding:12px;border-radius:6px;font-size:14px}.err{color:#c00}</style></head><body>
<p><a href="./">Next Human Publisher</a></p>
<h1>Connect TikTok</h1>
<div id="out"></div>
<script>
var REDIRECT=location.origin+location.pathname, SCOPES="user.info.basic,video.upload,video.publish";
var q=new URLSearchParams(location.search), out=document.getElementById("out");
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v);}catch(e){return null;}}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML;}
if(q.get("error")){
  out.innerHTML='<p class="err">Authorization not completed: '+esc(q.get("error")+" "+(q.get("error_description")||""))+'</p><p><a href="'+REDIRECT+'">Start again</a></p>';
}else if(q.get("code")){
  var code=q.get("code"), ok=q.get("state")&&q.get("state")===ss("tt_state");
  history.replaceState(null,"",location.pathname);
  if(!ok){out.innerHTML='<p class="err">Security check failed (state). <a href="'+REDIRECT+'">Start again</a>.</p>';}
  else{
    out.innerHTML='<p>Step 2 of 2. Paste the <b>Client secret</b> (Sandbox). It stays in this browser and is sent only to TikTok.</p>'+
      '<label>Client secret</label><input id="sec" type="password" autocomplete="off"><button id="go">Get refresh token</button><div id="res"></div>';
    document.getElementById("go").onclick=function(){
      var body=new URLSearchParams({client_key:ss("tt_key")||"",client_secret:document.getElementById("sec").value.trim(),
        code:code,grant_type:"authorization_code",redirect_uri:REDIRECT});
      fetch("https://open.tiktokapis.com/v2/oauth/token/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body})
      .then(function(r){return r.json();}).then(function(j){
        var res=document.getElementById("res");
        if(!j.refresh_token){res.innerHTML='<p class="err">Error: '+esc(JSON.stringify(j))+'</p><p>The code works once and expires in a few minutes: <a href="'+REDIRECT+'">start again</a>.</p>';return;}
        document.getElementById("sec").value="";
        res.innerHTML='<p>Done. Granted scopes: <b>'+esc(j.scope||"")+'</b>. Refresh token (valid about '+Math.round((j.refresh_expires_in||0)/86400)+' days):</p><code id="rt"></code><button id="cp">Copy</button>'+
          '<p>Save it in the cloud environment as <b>TT_REFRESH_TOKEN</b>, then close this page.</p>';
        document.getElementById("rt").textContent=j.refresh_token;
        document.getElementById("cp").onclick=function(){navigator.clipboard.writeText(j.refresh_token);this.textContent="Copied";};
      }).catch(function(e){document.getElementById("res").innerHTML='<p class="err">Network error: '+esc(String(e))+'</p>';});
    };
  }
}else{
  out.innerHTML='<p>Step 1 of 2. Paste the <b>Client key</b> (Sandbox) and log in with the TikTok account to connect.</p>'+
    '<label>Client key</label><input id="key" autocomplete="off"><button id="start">Connect with TikTok</button>';
  document.getElementById("start").onclick=function(){
    var key=document.getElementById("key").value.trim(); if(!key)return;
    var st=Array.from(crypto.getRandomValues(new Uint8Array(16)),function(b){return b.toString(16).padStart(2,"0");}).join("");
    ss("tt_key",key); ss("tt_state",st);
    location.href="https://www.tiktok.com/v2/auth/authorize/?"+new URLSearchParams({client_key:key,scope:SCOPES,response_type:"code",redirect_uri:REDIRECT,state:st});
  };
}
</script>
<footer style="margin-top:40px;font-size:.9em;color:#666"><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></footer>
</body></html>
